[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4"]
# S603/S607: subprocess use is intentional in lab tooling.
# S310: urlopen targets a user-supplied, trusted webhook (documented inline).
ignore = ["S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are expected in tests
